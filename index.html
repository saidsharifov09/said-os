<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAID OS</title>
  <meta name="description" content="Личный органайзер: задачи, календарь, заметки, привычки. Работает офлайн, данные только на устройстве.">
  <meta name="theme-color" content="#EEF2F7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SAID OS">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Тема применяется до отрисовки, чтобы экран не мигал. По умолчанию — светлая.
    (function () {
      try {
        var m = localStorage.getItem('said-os-theme') || 'light';
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#0E141B';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div id="app"><div class="boot">SAID OS</div></div>
  <div id="banners" aria-live="assertive"></div>
  <div id="overlays"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Для работы SAID OS нужен JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
